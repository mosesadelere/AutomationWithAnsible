---
# handlers file for apache
- name: restart apache service
  ansible.builtin.shell: |
    if systemctl list-units --all 2>/dev/null | grep -q httpd; then
      systemctl restart httpd
    elif [ -f /var/run/httpd/httpd.pid ]; then
      kill -HUP $(cat /var/run/httpd/httpd.pid)
    else
      /usr/sbin/httpd
    fi
  args:
    warn: false
  changed_when: false