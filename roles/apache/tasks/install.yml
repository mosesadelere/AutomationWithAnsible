---

- name: Install Apache web server using vault.centos.org repos
  ansible.builtin.command: >
    yum install -y httpd
    --disablerepo='*'
    --enablerepo=baseos,appstream,extras
    --setopt=baseos.baseurl=http://vault.centos.org/centos/8/BaseOS/x86_64/os/
    --setopt=appstream.baseurl=http://vault.centos.org/centos/8/AppStream/x86_64/os/
    --setopt=extras.baseurl=http://vault.centos.org/centos/8/extras/x86_64/os/
    --nogpgcheck
  args:
    warn: false
  register: apache_install
  changed_when: "'Complete!' in apache_install.stdout"

    